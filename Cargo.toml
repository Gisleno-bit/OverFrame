[package]
name = "overframe"
version = "0.5.0"
edition = "2021"
rust-version = "1.74"
description = "OVERFRAME — an open, tournament-ready platform fighter with rollback-ready deterministic simulation."
license = "MIT"
repository = "https://github.com/Gisleno-bit/overframe"
readme = "README.md"
keywords = ["platform-fighter", "fighting-game", "rollback", "netcode", "game"]
categories = ["games"]

# The game binary (GUI, macroquad).
[[bin]]
name = "overframe"
path = "src/main.rs"

# Headless tool: play a scripted demo and render it to an animated GIF.
# Builds without any windowing/OpenGL, so it runs on servers and in CI.
[[bin]]
name = "overframe-replay"
path = "src/bin/replay.rs"
required-features = ["headless"]

[features]
default = ["gui"]
# The interactive game (window, menus, local + online play, gamepads).
gui = ["dep:macroquad", "dep:gilrs", "netcode", "gltf"]
# Rollback networking via GGRS (P2P sessions, sync test, room codes, identity).
netcode = ["dep:ggrs", "dep:bytemuck", "dep:bincode", "dep:serde", "dep:rand"]
# CPU rasteriser for the headless GIF tool (no GPU / display needed).
headless = ["dep:image"]
# glTF 2.0 (.glb) import of artist-made fighters and stages (see docs/ART_PIPELINE.md).
gltf = ["dep:gltf"]

[dependencies]
macroquad = { version = "0.4", features = ["audio"], optional = true }
ggrs = { version = "0.10", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
image = { version = "0.25", default-features = false, features = ["gif", "png"], optional = true }
gilrs = { version = "0.11.0", optional = true }
bincode = { version = "1.3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
rand = { version = "0.8", optional = true }
gltf = { version = "1.4", default-features = false, features = ["utils", "names"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Keep unwinding: the audio mixer runs on its own thread and, on a machine
# with no output device, that thread panics — the game must carry on silent
# rather than abort.
panic = "unwind"

[profile.dev]
opt-level = 1
